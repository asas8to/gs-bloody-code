<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>منصة احترافية لتعليم برمجة المواقع</title>

<style>
body{
    margin:0;
    font-family:Tahoma;
    background:#0b0b0b;
    color:#fff;
}
header{
    background:#000;
    padding:20px;
    text-align:center;
    font-size:24px;
    box-shadow:0 0 20px #00ff99;
}
nav{
    background:#111;
    padding:15px;
    text-align:center;
}
nav button{
    background:#00ff99;
    border:none;
    padding:12px 18px;
    margin:5px;
    font-size:15px;
    font-weight:bold;
    border-radius:6px;
    cursor:pointer;
}
nav button:hover{
    background:#00cc77;
}
section{
    max-width:900px;
    margin:30px auto;
    background:#151515;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 20px #00ff9944;
}
iframe{
    width:100%;
    height:400px;
    border:none;
    border-radius:12px;
}
h2{
    color:#00ff99;
}
p{
    font-size:17px;
    line-height:1.7;
}
</style>
</head>

<body>

<header>
🚀 منصة احترافية لتعليم برمجة المواقع
</header>

<nav>
<button onclick="html()">HTML</button>
<button onclick="css()">CSS</button>
<button onclick="js()">JavaScript</button>
<button onclick="project()">مشروع موقع كامل</button>
</nav>

<section id="content">
<h2>ابدأ تعلم البرمجة من الصفر</h2>
<p>
هنا راح تتعلم شلون تبني موقع قوي واحترافي خطوة خطوة
من HTML إلى JavaScript مع تطبيق عملي.
</p>
</section>

<script>
function html(){
document.getElementById("content").innerHTML=`
<h2>HTML – أساس بناء الموقع</h2>
<p>
HTML هي الهيكل الأساسي لأي موقع. بدونها ماكو موقع.
راح تتعلم العناوين، الفقرات، الصور، الروابط.
</p>
<iframe src="https://www.youtube.com/embed/6QAELgirvjs"></iframe>
`;
}

function css(){
document.getElementById("content").innerHTML=`
<h2>CSS – تصميم الموقع</h2>
<p>
CSS تخلي موقعك قوي شكلاً: ألوان، خطوط، ترتيب، احتراف.
</p>
<iframe src="https://www.youtube.com/embed/1Rs2ND1ryYc"></iframe>
`;
}

function js(){
document.getElementById("content").innerHTML=`
<h2>JavaScript – قوة الموقع</h2>
<p>
JavaScript تخلي الموقع يتفاعل: أزرار، تنبيهات، حركات.
</p>
<iframe src="https://www.youtube.com/embed/PkZNo7MFNFg"></iframe>
`;
}

function project(){
document.getElementById("content").innerHTML=`
<h2>مشروع: إنشاء موقع احترافي كامل</h2>
<p>
بهذا الدرس راح تطبق كلشي تعلمته وتسوي موقع حقيقي من الصفر.
</p>
<iframe src="https://www.youtube.com/embed/mU6anWqZJcc"></iframe>
`;
}
</script>

</body>
</html>
