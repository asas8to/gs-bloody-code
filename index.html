<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إلى رهيف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: #0a0a0f;
    color: #f0e6d2;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px;
    text-align: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 1.2s ease, visibility 1.2s;
    z-index: 1;
  }
  .screen.active {
    opacity: 1;
    visibility: visible;
  }

  .welcome h1 {
    font-family: 'Amiri', serif;
    font-size: clamp(2rem, 8vw, 4rem);
    color: #e8c87a;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 2s 0.5s forwards;
  }
  .welcome p {
    font-size: clamp(1rem, 4vw, 1.3rem);
    color: #b8b0a0;
    max-width: 520px;
    line-height: 1.9;
    opacity: 0;
    animation: fadeUp 2s 1.5s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .promise h2 {
    font-family: 'Amiri', serif;
    font-size: clamp(1.5rem, 6vw, 2.8rem);
    color: #e8c87a;
    margin-bottom: 30px;
    min-height: 3em;
  }
  .promise-text {
    font-size: clamp(1rem, 4vw, 1.25rem);
    color: #d8d0c0;
    max-width: 620px;
    line-height: 2.2;
    min-height: 220px;
  }
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1.2em;
    background: #e8c87a;
    margin-right: 2px;
    animation: blink 0.8s infinite;
    vertical-align: middle;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  .btn {
    margin-top: 40px;
    padding: 14px 40px;
    background: transparent;
    color: #e8c87a;
    border: 1.5px solid #e8c87a;
    border-radius: 50px;
    font-family: 'Cairo', sans-serif;
    font-size: 1.05rem;
    cursor: pointer;
    transition: all 0.4s ease;
    opacity: 0;
    animation: fadeUp 1.5s 2s forwards;
  }
  .btn:hover {
    background: #e8c87a;
    color: #0a0a0f;
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(232, 200, 122, 0.3);
  }

  .final h2 {
    font-family: 'Amiri', serif;
    font-size: clamp(1.8rem, 7vw, 3.5rem);
    color: #e8c87a;
    margin-bottom: 25px;
    line-height: 1.5;
  }
  .final .heart {
    font-size: clamp(2rem, 8vw, 4rem);
    color: #c94a4a;
    animation: heartbeat 1.5s infinite;
    margin: 15px 0;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15); }
    50% { transform: scale(1); }
    75% { transform: scale(1.1); }
  }
  .final .signature {
    margin-top: 35px;
    font-size: 1rem;
    color: #8a8070;
    font-style: italic;
  }

  .next {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: none;
    border: none;
    color: #6a6255;
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    cursor: pointer;
    transition: color 0.3s;
    z-index: 5;
  }
  .next:hover { color: #e8c87a; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- الشاشة 1 -->
<section class="screen active welcome" id="screen1">
  <h1>رهيف</h1>
  <p>هذا مو بس موقع…<br>هذا شي سويته إلك بيدي، وبكل قلبي.</p>
  <button class="next" onclick="nextScreen(2)">دوسي هنا →</button>
</section>

<!-- الشاشة 2 -->
<section class="screen promise" id="screen2">
  <h2>وعد</h2>
  <div class="promise-text" id="promiseText"></div>
  <button class="btn" id="finalBtn" onclick="nextScreen(3)" style="display:none;">باقي شي أخير</button>
</section>

<!-- الشاشة 3 -->
<section class="screen final" id="screen3">
  <div class="heart">❤</div>
  <h2>أحبج… وأريدج تصيرين زوجتي بالحقيقة.</h2>
  <p style="color:#b8b0a0; font-size:1.1rem; line-height:2; max-width:520px;">
    وعد مني: أبقى يمّج، وأختارج كل يوم من جديد.<br>هذا مو كلام موقع… هذا كلامي أنا.
  </p>
  <div class="signature">— من واحد يحبج، وبس</div>
</section>

<script>
  const stars = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    stars.appendChild(s);
  }

  function nextScreen(n) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen' + n).classList.add('active');
    if (n === 2) setTimeout(typePromise, 800);
  }

  const promiseTextContent = "أوعدج أكون إلج سند، مو حمل.\nأوعدج أحفظ قلبج مثل ما أحفظ اسمج.\nوأوعدج نبقى سوا، وبيتنا يصير بيت يليق بيج.\n\nهذا وعدي… إلج، وأدام الله.";

  const promiseTextEl = document.getElementById('promiseText');
  const finalBtn = document.getElementById('finalBtn');
  let charIndex = 0;

  function typePromise() {
    promiseTextEl.innerHTML = '';
    charIndex = 0;
    finalBtn.style.display = 'none';
    typeChar();
  }

  function typeChar() {
    if (charIndex < promiseTextContent.length) {
      const ch = promiseTextContent[charIndex];
      if (ch === '\n') {
        promiseTextEl.innerHTML += '<br>';
      } else {
        promiseTextEl.innerHTML += ch;
      }
      charIndex++;
      setTimeout(typeChar, 45);
    } else {
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      promiseTextEl.appendChild(cursor);
      finalBtn.style.display = 'inline-block';
      finalBtn.style.animation = 'fadeUp 1.5s forwards';
    }
  }
</script>

</body>
</html>
