<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل وتشغيل لعبة فكر الجاسوس</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1c23;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            text-align: center;
            background: #2c3e50;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
            border: 4px solid #e74c3c;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #f1c40f;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.3);
        }
        p {
            font-size: 16px;
            color: #bdc3c7;
            line-height: 1.6;
        }
        .btn-play {
            display: inline-block;
            background-color: #e74c3c;
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            border-bottom: 5px solid #c0392b;
            margin-top: 25px;
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }
        .btn-play:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(231, 76, 60, 0.6);
        }
        .btn-play:active {
            transform: translateY(3px);
            border-bottom-width: 0;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔥 فِـكـر الـجـاسـوس 🔥</h1>
        <p>مرحباً بك في الموقع الرسمي للعبة! اضغط على الزر أدناه لتشغيل اللعبة فوراً على جوالك بدقة عالية وبدون حاجة للتحميل أو التثبيت!</p>
        
        <!-- هنا نربط اللعبة مباشرة لتفتح كصفحة ويب سريعة -->
        <a href="game.html" class="btn-play">🎮 العب الآن فوراً 🎮</a>
        
        <div class="footer">تطوير وإعداد المبرمجة رتاج 🚀</div>
    </div>

</body>
</html>
