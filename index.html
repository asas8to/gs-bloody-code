<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>برنامج تعليم البرمجة</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg,#0f0f0f,#1c1c1c);
    color: white;
    text-align: center;
}

/* شريط علوي */
header {
    background: #000;
    padding: 15px;
    font-size: 22px;
    font-weight: bold;
    box-shadow: 0 0 10px #00ffcc;
}

/* أزرار */
.buttons {
    margin: 20px;
}
button {
    background: #00ffcc;
    border: none;
    padding: 12px 20px;
    margin: 5px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}
button:hover {
    background: #00ccaa;
}

/* صندوق المحتوى */
.box {
    background: #1a1a1a;
    padding: 20px;
    margin: 20px auto;
    width: 90%;
    max-width: 800px;
    border-radius: 15px;
    box-shadow: 0 0 15px #00ffcc44;
}

/* فيديو */
iframe {
    width: 100%;
    height: 350px;
    border-radius: 12px;
    border: none;
}
</style>
</head>

<body>

<header>
📘 برنامج تعليم لغات البرمجة
</header>

<div class="buttons">
<button onclick="showHTML()">HTML</button>
<button onclick="showPython()">Python</button>
<button onclick="showJS()">JavaScript</button>
</div>

<div class="box" id="content">
<h2>اختر لغة برمجة 👆</h2>
<p>وتعلّم من الفيديو داخل البرنامج</p>
</div>

<script>
function showHTML() {
    document.getElementById("content").innerHTML = `
    <h2>HTML</h2>
    <p>لغة بناء وتصميم مواقع الإنترنت</p>
    <iframe src="https://www.youtube.com/embed/qz0aGYrrlhU"></iframe>
    `;
}

function showPython() {
    document.getElementById("content").innerHTML = `
    <h2>Python</h2>
    <p>لغة سهلة وقوية للبرامج والألعاب</p>
    <iframe src="https://www.youtube.com/embed/_uQrJ0TkZlc"></iframe>
    `;
}

function showJS() {
    document.getElementById("content").innerHTML = `
    <h2>JavaScript</h2>
    <p>لغة تخلي المواقع تتحرك وتتفاعل</p>
    <iframe src="https://www.youtube.com/embed/hdI2bqOjy3c"></iframe>
    `;
}
</script>

</body>
</html>
