<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أقوى مبرمج فري فاير - شحن مجاني</title>
    <style>
        body {
            margin: 0;
            font-family: Tahoma, Geneva, Verdana, sans-serif;
            background: #09090e;
            color: #fff;
            text-align: center;
        }
        header {
            background: #11111b;
            padding: 25px;
            font-size: 24px;
            font-weight: bold;
            border-bottom: 3px solid #ff0055;
            text-shadow: 0 0 10px #ff0055;
        }
        .points-bar {
            background: #161623;
            padding: 12px;
            font-size: 18px;
            color: #00ffcc;
            border-bottom: 1px solid #222;
        }
        .points-bar span {
            background: #ff0055;
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
        }
        nav button {
            background: transparent;
            border: 2px solid #ff0055;
            color: #fff;
            padding: 12px 25px;
            margin: 10px 5px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        nav button.active, nav button:hover {
            background: #ff0055;
            box-shadow: 0 0 15px #ff0055;
        }
        section {
            max-width: 750px;
            margin: 20px auto;
            background: #12121f;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #222;
        }
        .card {
            background: #1c1c2e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-right: 5px solid #00ffcc;
        }
        .btn-action {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn-action:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #1c1c2e;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
        }
        #timer-box {
            font-size: 20px;
            color: #ffcc00;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    🔥 منصة أقوى مبرمج فري فاير لشحن المتابعين مجاناً بـ البوتات
</header>

<div class="points-bar">
    رصيدك الحالي: <span id="user-points">0</span> نقطة
</div>

<nav>
    <button onclick="showTasks()" id="btn-tasks" class="active">💰 تجمع نقاط (مشاهدة وإعلان)</button>
    <button onclick="showStore()" id="btn-store">🚀 رشق المتابعين في قناتك</button>
</nav>

<section id="content">
    </section>

<script>
let points = 0;
let isWatching = false;

// رابط قناتك الحقيقي من الصورة لفتحه للمستخدمين
const myYoutubeChannel = "https://www.youtube.com/channel/UC1RyqPzuquA2fdcZ31bSTvw"; 

function showTasks() {
    document.getElementById("btn-tasks").className = "active";
    document.getElementById("btn-store").className = "";

    document.getElementById("content").innerHTML = `
        <h2>🎁 اجمع النقاط لدعم قناتك</h2>
        <p>شاهد فيديو مبرمج فري فاير لمدة 30 ثانية كاملة لفتح الروابط والحصول على +10 نقاط!</p>
        
        <div class="card">
            <h3>شاهد الإعلان والفيديو لدعم البوتات</h3>
            <p>يجب عدم إغلاق النافذة حتى ينتهي العداد لكي تُحسب النقاط.</p>
            <div id="timer-box"></div>
            <button class="btn-action" id="start-btn" onclick="startWatchTask()">اضغط هنا لبدء المشاهدة والإعلان (30 ثانية)</button>
        </div>
    `;
}

function showStore() {
    document.getElementById("btn-store").className = "active";
    document.getElementById("btn-tasks").className = "";

    document.getElementById("content").innerHTML = `
        <h2>🚀 اطلب المتابعين الحقيقيين الآن</h2>
        <p>كل 10 نقاط تمنحك مشتركين حقيقيين من سيرفر البوتات الخاص بنا.</p>
        
        <input type="text" id="user-chan-link" placeholder="ضع رابط قناتك هنا">
        <input type="number" id="req-count" placeholder="كم مشترك تريد؟" min="1">
        
        <button class="btn-action" style="background:#ff0055; color:#fff;" onclick="processOrder()">تفعيل رشق البوتات الآن</button>
    `;
}

function startWatchTask() {
    if(isWatching) return;
    isWatching = true;
    
    // فتح قناتك أو رابط إعلاني حقيقي لكسب المال والمشاهدات
    window.open(myYoutubeChannel, '_blank');

    let timeLeft = 30;
    const btn = document.getElementById("start-btn");
    const timerBox = document.getElementById("timer-box");
    
    btn.disabled = true;
    
    let countdown = setInterval(() => {
        timeLeft--;
        btn.innerText = `انتظر جاري التحقق من الإعلان والمشاهدة... (${timeLeft})`;
        
        if (timeLeft <= 0) {
            clearInterval(countdown);
            points += 10;
            document.getElementById("user-points").innerText = points;
            btn.innerText = "اكتملت المهمة! حصلت على +10 نقاط";
            timerBox.innerText = "🎉 تم إضافة النقاط بنجاح!";
            isWatching = false;
            btn.disabled = false;
        }
    }, 1000);
}

function processOrder() {
    let link = document.getElementById("user-chan-link").value;
    let count = parseInt(document.getElementById("req-count").value);

    if(!link || !count) {
        alert("تأكد من كتابة الرابط والعدد المطلوب!");
        return;
    }

    if(points < count) {
        alert(`نقاطك غير كافية! تحتاج إلى ${count} نقطة ورصيدك الحالي هو ${points}`);
        return;
    }

    points -= count;
    document.getElementById("user-points").innerText = points;
    alert("🔥 تم ربط قناتك بنجاح في سيرفر البوتات! انتظر بدء الزيادة خلال 24 ساعة.");
}

showTasks();
</script>

</body>
</html>
